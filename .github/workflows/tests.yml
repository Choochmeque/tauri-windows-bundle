name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  # Superseded runs cancel per workflow+ref (PR merge refs and branch pushes
  # alike); main is pinned to a unique group (run_id) so every commit on main
  # gets its own uncancellable verification run.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: JavaScript/TypeScript Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage to Codecov
        if: ${{ github.actor != 'dependabot[bot]' }}
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./coverage/coverage-final.json

  # Packs a real .msix with the bundled msixbundle-cli sidecar (win32-only,
  # installed automatically by pnpm via optionalDependencies) and asserts the
  # artifact's actual contents. TWB_REQUIRE_INTEGRATION makes a silent skip
  # impossible: on this job a missing cli fails the build.
  integration:
    name: MSIX artifact verification
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install

      - name: Verify packaged artifact
        run: pnpm exec vitest run tests/integration.pack.test.ts
        env:
          TWB_REQUIRE_INTEGRATION: '1'
